# V0.3 按工程规范 §5.3 出免安装候选包（--dir）；NSIS 安装包留到 V0.6
appId: com.ivai.kithoard
productName: Kithoard
directories:
  output: dist

# 直接用 node_modules 里已下载的 Electron，避免打包阶段再走网络下载
electronDist: node_modules/electron/dist

# 渲染层已由 electron-vite 打进 out/；node_modules 只随包携带生产依赖
files:
  - out/**/*
  - package.json

asar: true
# 原生模块留在 asar 外才能被 Electron 加载：
# better-sqlite3 的 prebuildify 二进制、sharp 的 libvips 与 @img 平台包
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
# better-sqlite3 v13 自带 prebuildify 预编译二进制，无需本机 Visual Studio；
# 强制 rebuild 反而会因缺少编译环境失败
npmRebuild: false

# FFmpeg 静态二进制随包到 resources/bin；主进程按 process.resourcesPath 查找
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - ffmpeg.exe
      - ffprobe.exe
  # 托盘图标随包到 resources/icons；缺失时托盘起不来，主进程会直接报错
  - from: resources/icons
    to: icons

# 放在安装目录根部而不是打进 asar：随包分发 GPL v3 的 FFmpeg 时，
# 用户与再分发者要能直接看到许可与构建来源，藏进 asar 等于没提供。
extraFiles:
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - README.md

win:
  target:
    - nsis
  artifactName: Kithoard-${version}-x64.${ext}
  # 此前不配 icon，打出来的 exe 与安装包都用 Electron 默认图标
  icon: build/icon.png

# V0.6 安装包：可选安装目录、桌面与开始菜单快捷方式；卸载默认保留用户数据与素材
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kithoard 栖材坞
  deleteAppDataOnUninstall: false
  artifactName: Kithoard-Setup-${version}-x64.${ext}
